# Copy this file to $XDG_CONFIG_HOME/$ASH_NAME/config.toml. ASH_NAME defaults
# to ash; if XDG_CONFIG_HOME is unset, use ~/.config/$ASH_NAME/config.toml.
# You can also pass `ash spawn --config PATH`.

[global]
# VM memory in MiB. Defaults to 4096.
# memory = 8192

# Private host bridge used for VM networking. Defaults shown below.
# network_bridge = "ash0"
# qemu_bridge_helper = "/run/wrappers/bin/qemu-bridge-helper"

# Shared Vulkan GPU acceleration. Ash keeps the physical GPU attached to the
# host and exposes a headless VirtIO-GPU device to the guest through QEMU's
# virglrenderer/Venus backend. memory_mib controls the host-visible GPU memory
# window and defaults to 8192 MiB.
# [global.gpu]
# mode = "shared"
# memory_mib = 8192

# Nix store strategy. "shared" is the default and exposes the host store
# read-only through virtiofs. "image" creates a private ext4 image mounted at
# /nix by a compatible guest configuration.
# [global.nix_store]
# strategy = "image"
# image_size_mib = 32768

# Override these defaults per VM with --nix-store-strategy and
# --nix-store-image-size-mib. Ash saves explicit overrides in ash-state.toml.

# Host capability Portal. Managed mode starts one vsock host per VM.
[portal]
enabled = true
global = false
# In global mode, set transport = "vsock", start agent-portal-host yourself,
# and use these client destination values:
# transport = "vsock"
# vsock_cid = 2
# vsock_port = 4050
# socket_path is used only by standalone Unix-socket operation.
# socket_path = "/run/user/1000/agent-portal/portal.sock"
# prompt_command = "rofi -dmenu -p 'agent-portal'"

[portal.policy.defaults]
clipboard_read_image = "allow"
gh_exec = "ask_for_writes"

[spaces.common]
ro_mounts = [
  "~/.config/git:~/.config/git",
]

# A local-model space can expose host model caches to selected agent VMs.
# Use rw_mounts when the guest should download or update models, or ro_mounts
# when the host cache must remain immutable.
# [spaces.local-models]
# rw_mounts = [
#   "~/.cache/huggingface:~/.cache/huggingface",
#   "~/.ollama/models:~/.ollama/models",
# ]

[spaces.ash]
# Extended spaces are evaluated first. Composition is recursive, and each space
# is evaluated once even when it is reachable through multiple paths.
extends = ["common"]

# Entries may use HOST_PATH or HOST_PATH:GUEST_PATH.
# Host ~ resolves to the host user's home. Guest ~ resolves to the guest user's home.
rw_mounts = [
  "~/dev/fr/ash",
  "~/dev/fr/ash:/home/agent/workspace/ash",
]

ro_mounts = [
  "~/dev/reference:~/reference",
  "/var/lib/data:/mnt/data",
]
